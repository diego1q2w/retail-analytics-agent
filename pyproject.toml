[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "retail-analytics-agent"
version = "0.1.0"
description = "Conversational retail analytics assistant: CLI over an HTTP backend, Pydantic AI agent, Temporal durable execution, PostgreSQL state and read-only BigQuery analysis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Direct runtime dependencies: exact pins, one per line, sorted by name.
# After editing, regenerate requirements.txt (see README "Dependencies").
dependencies = [
    "alembic==1.20.0",
    "click==8.5.0",
    "fastapi==0.142.4",
    "google-cloud-bigquery==3.46.1",
    "google-genai==2.29.0",
    "httpx==0.28.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "psycopg[binary]==3.3.6",
    "pydantic-ai-slim[google,openai,temporal]==2.54.0",
    "pydantic==2.13.5",
    "pyjwt==2.15.1",
    "python-dotenv==1.2.4",
    "sqlalchemy==2.1.4",
    "sqlglot==30.21.0",
    "temporalio==1.34.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
# Development and check tooling: exact pins, one per line, sorted by name.
dev = [
    "duckdb==1.5.6",
    "hypothesis==6.168.5",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[project.scripts]
analytics = "retail_analytics.bootstrap.cli:main"
retail-analytics-check-credentials = "retail_analytics.bootstrap.check_credentials:main"
retail-analytics-dev-access = "retail_analytics.bootstrap.dev_access:main"
retail-analytics-eval = "retail_analytics.bootstrap.evaluate:main"
retail-analytics-api = "retail_analytics.bootstrap.api:main"
retail-analytics-worker = "retail_analytics.bootstrap.worker:main"
retail-analytics-maintenance = "retail_analytics.bootstrap.maintenance:main"
retail-analytics-persona = "retail_analytics.bootstrap.persona_admin:main"
retail-analytics-knowledge = "retail_analytics.bootstrap.knowledge_admin:main"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_analytics"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
extend-exclude = ["tests/architecture/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "TID", "ASYNC"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S603"]
# Compiler tests deliberately build (often hostile) SQL text.
"tests/unit/sql_compiler/**" = ["S101", "S608"]
"tests/unit/privacy/**" = ["S101", "S608"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
exclude = ["^tests/architecture/fixtures/"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m \"not docker\""
markers = [
    "docker: needs a local Docker daemon (Compose stack); excluded by default, run with -m docker",
    "real_telemetry: builds the real telemetry sink (tests/conftest.py otherwise forces a no-op)",
    "live: needs real external credentials (BigQuery, model providers); skipped when absent",
]
