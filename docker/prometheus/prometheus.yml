# Local Prometheus. No project-specific retention: server defaults apply.
# The application scrape job is added with the metrics instrumentation task;
# synthetic/test metrics can be pushed through the OTLP receiver enabled in compose.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
