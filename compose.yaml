# Local persistence, Temporal and telemetry (MLflow, Prometheus, Grafana) for development and tests. Local-only defaults:
# every password below is a throwaway value for a loopback-bound stack.
# Override ports/passwords with the COMPOSE_* variables shown (shell or .env).
# Use a unique `docker compose -p <name>` per checkout/test run to isolate stacks.
name: retail-analytics-local

x-postgres-image: &postgres-image postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
x-temporal-server-image: &temporal-server-image temporalio/server:1.32.0@sha256:c3e752127759616bb1615e0f9ba0e21635aeb5fdeb922de4f371c350955f46ae
x-temporal-tools-image: &temporal-tools-image temporalio/admin-tools:1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
x-prometheus-image: &prometheus-image prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac
x-grafana-image: &grafana-image grafana/grafana:12.4.12@sha256:83be3e511ede559bee80e2215bb1987cb1246075461cb961beb515b0341e7aea

services:
  # One PostgreSQL server, three databases, three roles (see the init script):
  #   retail_app  -> database retail_app (application state)
  #   temporal    -> databases temporal + temporal_visibility (Temporal internals)
  #   db_admin    -> superuser for administration only; the application never uses it
  postgres:
    image: *postgres-image
    environment:
      POSTGRES_USER: db_admin
      POSTGRES_PASSWORD: ${COMPOSE_PG_ADMIN_PASSWORD:-local-only-admin}
      POSTGRES_DB: postgres
      RETAIL_APP_PASSWORD: ${COMPOSE_APP_DB_PASSWORD:-local-only-app}
      TEMPORAL_DB_PASSWORD: ${COMPOSE_TEMPORAL_DB_PASSWORD:-local-only-temporal}
    ports:
      - "127.0.0.1:${COMPOSE_POSTGRES_PORT:-55442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: the throwaway server used for first-time init is socket-only.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U db_admin -d retail_app && pg_isready -h 127.0.0.1 -U db_admin -d temporal"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Temporal server (frontend, history, matching, worker in one process) on the
  # `temporal` database. Its schema is applied by temporal-schema below.
  temporal:
    image: *temporal-server-image
    entrypoint: ["sh", "/etc/temporal/start-server.sh"]
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      TEMPORAL_DB_HOST: postgres
      TEMPORAL_DB_NAME: temporal
      TEMPORAL_VISIBILITY_DB_NAME: temporal_visibility
      TEMPORAL_DB_USER: temporal
      TEMPORAL_DB_PASSWORD: ${COMPOSE_TEMPORAL_DB_PASSWORD:-local-only-temporal}
    ports:
      - "127.0.0.1:${COMPOSE_TEMPORAL_PORT:-57233}:7233"
    volumes:
      - ./docker/temporal/config.yaml:/etc/temporal/config.template.yaml:ro
      - ./docker/temporal/start-server.sh:/etc/temporal/start-server.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z $(hostname) 7233"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 5s

  # One-shot: create/upgrade Temporal's own schema as the temporal role.
  # Safe to rerun; temporal-sql-tool only applies versions not yet applied.
  temporal-schema:
    image: *temporal-tools-image
    entrypoint: ["sh", "/schema/apply-schema.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TEMPORAL_DB_HOST: postgres
      TEMPORAL_DB_USER: temporal
      TEMPORAL_DB_PASSWORD: ${COMPOSE_TEMPORAL_DB_PASSWORD:-local-only-temporal}
    volumes:
      - ./docker/temporal/apply-schema.sh:/schema/apply-schema.sh:ro
    restart: "no"

  # One-shot: wait for the frontend and register the application namespace with
  # 7-day retention of closed workflow histories. Idempotent.
  temporal-namespace:
    image: *temporal-tools-image
    entrypoint: ["sh", "/schema/ensure-namespace.sh"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${COMPOSE_TEMPORAL_NAMESPACE:-default}
      TEMPORAL_RETENTION: ${COMPOSE_TEMPORAL_RETENTION:-168h}
    volumes:
      - ./docker/temporal/ensure-namespace.sh:/schema/ensure-namespace.sh:ro
    restart: "no"

  # One-shot: create the MLflow role + database (idempotent, works on existing volumes).
  mlflow-db-init:
    image: *postgres-image
    entrypoint: ["sh", "/init/ensure-mlflow-db.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPASSWORD: ${COMPOSE_PG_ADMIN_PASSWORD:-local-only-admin}
      MLFLOW_DB_PASSWORD: ${COMPOSE_MLFLOW_DB_PASSWORD:-local-only-mlflow}
    volumes:
      - ./docker/postgres/ensure-mlflow-db.sh:/init/ensure-mlflow-db.sh:ro
    restart: "no"

  # MLflow tracking server for sanitized agent traces. Backend store: its own
  # `mlflow` database/role; artifacts are served by the server (volume mlflow-artifacts).
  mlflow:
    build:
      context: ./docker/mlflow
    image: retail-analytics-mlflow:3.14.0
    depends_on:
      mlflow-db-init:
        condition: service_completed_successfully
    environment:
      MLFLOW_DB_PASSWORD: ${COMPOSE_MLFLOW_DB_PASSWORD:-local-only-mlflow}
    command:
      - sh
      - -c
      - >-
        exec mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri "postgresql://mlflow:$${MLFLOW_DB_PASSWORD}@postgres:5432/mlflow"
        --artifacts-destination /mlflow/artifacts --serve-artifacts
    ports:
      - "127.0.0.1:${COMPOSE_MLFLOW_PORT:-55500}:5000"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  # Prometheus metrics store. Default retention; OTLP receiver lets tests and the
  # application push metrics without an extra scrape endpoint.
  prometheus:
    image: *prometheus-image
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-otlp-receiver
    ports:
      - "127.0.0.1:${COMPOSE_PROMETHEUS_PORT:-59090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s

  # Grafana dashboards. Datasource and dashboards are provisioned from ./docker/grafana.
  grafana:
    image: *grafana-image
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${COMPOSE_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:${COMPOSE_GRAFANA_PORT:-53000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

volumes:
  postgres-data:
  mlflow-artifacts:
  prometheus-data:
  grafana-data:
